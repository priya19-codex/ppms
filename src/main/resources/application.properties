# ===================================================================
# PPMS - Paddy Procurement Management System Configuration
# ===================================================================
server.port=8080
server.servlet.context-path=/

spring.application.name=ppms

# Default database: H2 in MySQL compatibility mode (works instantly out-of-the-box)
spring.datasource.url=jdbc:h2:file:./data/ppms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Secret & Expiration (24 hours)
jwt.secret=9a7c3b1e5f8d2a4c6e0b7d9f1a3c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d5f7a9c
jwt.expiration-ms=86400000

# Logging
logging.level.com.agri.ppms=INFO
logging.level.org.springframework.security=WARN

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
