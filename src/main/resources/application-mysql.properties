# ===================================================================
# PPMS - MySQL 8 Configuration Profile (run with --spring.profiles.active=mysql)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ppms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
